 const bob=dancing?Math.sin(ts/130)*6:Math.sin(ts/110)*3;

 const dist=Math.hypot(wx-sx,wy-sy);

 if(IMG_MAO.complete&&IMG_MAO.naturalWidth){ctx.save();ctx.translate(tx,ty+bob*0.5);if(dancing)ctx.rotate(Math.sin(ts/170)*0.25);ctx.drawImage(IMG_MAO,(MAO.x-375)*PS,(MAO.y-207)*PS,IMG_MAO.naturalWidth*PS,IMG_MAO.naturalHeight*PS);ctx.restore()}

 ctx.fillStyle='#b5651d';ctx.fillRect(322,790,216,30);ctx.fillStyle='#8a4b12';ctx.fillRect(322,820,216,8);
